services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wr
      POSTGRES_PASSWORD: wr
      POSTGRES_DB: wohnungsradar
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wr -d wohnungsradar"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: Dockerfile, args: { APP: api } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://wr:wr@db:5432/wohnungsradar
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
    profiles: [full]

  worker:
    build: { context: ., dockerfile: Dockerfile, args: { APP: worker } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://wr:wr@db:5432/wohnungsradar
    depends_on: { db: { condition: service_healthy } }
    profiles: [full]

volumes:
  dbdata:
